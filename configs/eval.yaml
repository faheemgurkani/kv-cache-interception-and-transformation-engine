datasets:
  - wikitext
  - c4

wikitext:
  name: Salesforce/wikitext
  config: wikitext-2-raw-v1
  split: test

c4:
  name: c4
  config: en
  split: validation
  streaming: true

metrics:
  # FIDELITY (always on)
  - representation
  - attention
  - memory
  # BEHAVIOR (task_quality on by default; retrieval/reasoning/instruction_following are opt-in flags)
  - perplexity
  # SYSTEM (latency_throughput on by default; the rest are opt-in flags)
  - throughput

batch_size: 1
max_samples: null
perplexity_stride: 512
generated_tokens: 64
attention_fidelity_tokens: 512

# Phase 1 default; full sweeps use configs/model.yaml context_lengths
default_context_length: 512
