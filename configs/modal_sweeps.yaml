# Modal evaluation sweep presets (context lengths from configs/model.yaml unless overridden)
#
# Usage:
#   modal run modal_app/sweep.py::main --preset baseline   # shared no-compression baseline
#   modal run modal_app/sweep.py::main --preset turboquant
#   PRESET=qjl bash scripts/modal_run_sweep.sh

presets:
  baseline:
    - label: identity_baseline
      name: identity

  turboquant:
    - label: tq_full_b2
      name: turboquant
      stage: full
      bitwidth: 2
    - label: tq_full_b3
      name: turboquant
      stage: full
      bitwidth: 3
    - label: tq_full_b4
      name: turboquant
      stage: full
      bitwidth: 4
    - label: tq_mse_b4
      name: turboquant
      stage: wht_quant
      bitwidth: 4

  qjl:
    - label: qjl_default
      name: qjl
      bitwidth: 1
      seed: 42

  rocketkv:
    - label: rocketkv_r256
      name: rocketkv
      token_budget: 256
      hsa_budget: 256
      window_size: 32
    - label: rocketkv_r512
      name: rocketkv
      token_budget: 512
      hsa_budget: 512
      window_size: 32
    - label: rocketkv_r1024
      name: rocketkv
      token_budget: 1024
      hsa_budget: 1024
      window_size: 32

  # One job per active taxonomy plug-in (skip KIVI stub). ctx from CLI (smoke uses 128).
  # Budgets sized so eviction/projection actually fire at ctx=128.
  taxonomy_smoke:
    - label: identity_baseline
      name: identity
    - label: tq_full_b4
      name: turboquant
      stage: full
      bitwidth: 4
    - label: qjl_default
      name: qjl
      bitwidth: 1
      seed: 42
    - label: rocketkv_smoke
      name: rocketkv
      token_budget: 64
      hsa_budget: 64
      window_size: 8
    - label: snapkv_smoke
      name: snapkv
      max_capacity_prompt: 64
      window_size: 8
      kernel_size: 5
    - label: palu_smoke
      name: palu
      compression_rate: 0.5
      group_size: 1

  # Full redesigned eval: same 6 active plug-ins, paper gen=64 (ctx grid from CLI).
  taxonomy_full:
    - label: identity_baseline
      name: identity
    - label: tq_full_b4
      name: turboquant
      stage: full
      bitwidth: 4
    - label: qjl_default
      name: qjl
      bitwidth: 1
      seed: 42
    - label: rocketkv_smoke
      name: rocketkv
      token_budget: 64
      hsa_budget: 64
      window_size: 8
    - label: snapkv_smoke
      name: snapkv
      max_capacity_prompt: 64
      window_size: 8
      kernel_size: 5
    - label: palu_smoke
      name: palu
      compression_rate: 0.5
      group_size: 1

preset_options:
  taxonomy_smoke:
    run_reasoning: true
    run_kernel_cost: true
    run_memory_bandwidth: true
    generated_tokens: 8
  taxonomy_full:
    run_reasoning: true
    run_kernel_cost: true
    run_memory_bandwidth: true
    generated_tokens: 64
