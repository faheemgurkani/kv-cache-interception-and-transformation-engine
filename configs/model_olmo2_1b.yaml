model_name: allenai/OLMo-2-0425-1B
local_path: models/olmo2_1b

context_lengths:
  - 128
  - 256
  - 512

bitwidths:
  - 2
  - 3
  - 4

turboquant:
  default_bitwidth: 4
  default_stage: full
  attn_implementation: eager
  torch_dtype: float16

compatibility:
  architecture:
    family: mha
    q_heads: 16
    kv_heads: 16
  attention:
    adapter: olmo2
    qk_norm: flat
    rope: global
  cache:
    type: standard
  evaluation:
    fidelity_attention: supported
    behavior_identity: supported
    behavior_turboquant: supported
    behavior_qjl: supported
    behavior_rocketkv: supported
    system: supported
