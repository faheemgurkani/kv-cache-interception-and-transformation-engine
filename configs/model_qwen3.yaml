model_name: Qwen/Qwen3-1.7B
local_path: models/legacy/qwen3_1.7b

context_lengths:
  - 128
  - 256
  - 512

bitwidths:
  - 2
  - 3
  - 4

turboquant:
  default_bitwidth: 4
  default_stage: full
  attn_implementation: eager
  torch_dtype: float16

compatibility:
  architecture:
    family: gqa
    q_heads: 16
    kv_heads: 8
  attention:
    adapter: qwen3
    qk_norm: per_head
    rope: global
  cache:
    type: standard
  evaluation:
    fidelity_attention: supported
    behavior_identity: supported
    behavior_turboquant: supported
    behavior_qjl: supported
    behavior_rocketkv: supported
    system: supported
