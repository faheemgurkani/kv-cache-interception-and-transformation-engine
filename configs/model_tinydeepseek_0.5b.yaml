model_name: FreedomIntelligence/TinyDeepSeek-0.5B-base
local_path: models/tinydeepseek_0.5b

context_lengths:
  - 128
  - 256
  - 512

bitwidths:
  - 2
  - 3
  - 4

turboquant:
  default_bitwidth: 4
  default_stage: full
  attn_implementation: eager
  torch_dtype: float16

compatibility:
  architecture:
    family: mla
    q_heads: 4
    kv_heads: 4
  attention:
    adapter: deepseek_v3
    qk_norm: mla
    rope: split_nope_rope
  cache:
    type: expanded
    native_latent: true
  evaluation:
    fidelity_attention: supported
    behavior_identity: supported
    behavior_turboquant: supported
    behavior_qjl: supported
    behavior_rocketkv: supported
    system: supported
    total_state_accounting: required
