[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvbench"
version = "0.1.0"
description = "KVBench: unified online/offline evaluation framework for KV-cache compression in small language models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Muhammad Faheem", email = "faheemgurkani@gmail.com" },
]
keywords = [
  "kv-cache",
  "compression",
  "benchmark",
  "small-language-models",
  "evaluation",
]
dependencies = []

[project.urls]
Repository = "https://github.com/faheemgurkani/kv-cache-compression-benchmark-"
Issues = "https://github.com/faheemgurkani/kv-cache-compression-benchmark-/issues"

[tool.setuptools.packages.find]
include = [
  "framework*",
  "compressors*",
  "eval*",
  "data*",
  "reporting*",
  "quantizers*",
  "baselines*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
